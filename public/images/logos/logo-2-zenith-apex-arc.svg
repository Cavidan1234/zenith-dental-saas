<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="apexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Clean canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />

  <!-- Zenith Arc & Minimalist Dental Apex -->
  <g transform="translate(48, 48)">
    <!-- Outer Gentle Dental Silhouette Arc -->
    <path
      d="M 68,260 C 68,140 140,84 208,84 C 276,84 348,140 348,260 C 348,348 296,380 208,380 C 120,380 68,348 68,260 Z"
      fill="none"
      stroke="url(#apexGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.12"
    />

    <!-- Upward Rising Smile & Pinnacle (Zenith) Wave -->
    <path
      d="M 88,270 C 130,340 286,340 328,270 C 300,230 256,180 208,124 C 160,180 116,230 88,270 Z"
      fill="url(#apexGrad)"
    />

    <!-- Internal Radiant Negative Space Tooth Contour -->
    <path
      d="M 148,270 C 172,300 244,300 268,270 C 250,240 226,204 208,168 C 190,204 166,240 148,270 Z"
      fill="#ffffff"
    />

    <!-- Central Diamond Core -->
    <polygon points="208,198 226,236 208,274 190,236" fill="url(#sparkleGrad)" />

    <!-- Zenith Apex Brilliance Star (North-East Star of Excellence) -->
    <g transform="translate(320, 84)">
      <path
        d="M 0,-36 Q 0,0 36,0 Q 0,0 0,36 Q 0,0 -36,0 Q 0,0 0,-36 Z"
        fill="url(#sparkleGrad)"
      />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Secondary Micro Star -->
    <g transform="translate(96, 130)">
      <path
        d="M 0,-16 Q 0,0 16,0 Q 0,0 0,16 Q 0,0 -16,0 Q 0,0 0,-16 Z"
        fill="url(#sparkleGrad)"
        opacity="0.75"
      />
    </g>
  </g>
</svg>
