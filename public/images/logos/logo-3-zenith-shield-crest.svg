<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Clean canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />

  <!-- Symmetrical Zenith Shield & Dental Crown Crest -->
  <g transform="translate(56, 56)">
    <!-- Outer Shield Contour (Soft luxury curves) -->
    <path
      d="M 200,40 C 270,40 330,68 360,110 C 360,250 290,330 200,380 C 110,330 40,250 40,110 C 70,68 130,40 200,40 Z"
      fill="none"
      stroke="url(#shieldGrad)"
      stroke-width="14"
      stroke-linejoin="round"
      opacity="0.25"
    />

    <!-- Main Stylized Symmetrical Tooth Body with Crown Peaks -->
    <path
      d="M 200,80 C 230,80 256,104 274,136 C 294,172 306,220 286,274 C 272,310 244,342 200,366 C 156,342 128,310 114,274 C 94,220 106,172 126,136 C 144,104 170,80 200,80 Z"
      fill="url(#shieldGrad)"
    />

    <!-- Internal Facets (Dual Wing Aesthetics) -->
    <!-- Left Wing -->
    <path
      d="M 200,104 L 140,154 C 124,184 116,224 130,264 L 200,344 Z"
      fill="#ffffff"
      opacity="0.18"
    />
    <!-- Right Wing -->
    <path
      d="M 200,104 L 260,154 C 276,184 284,224 270,264 L 200,344 Z"
      fill="#ffffff"
      opacity="0.28"
    />

    <!-- Central Precision Crown Diamond / Zenith Peak -->
    <g transform="translate(200, 204)">
      <!-- Diamond Star -->
      <path
        d="M 0,-44 Q 0,0 36,0 Q 0,0 0,44 Q 0,0 -36,0 Q 0,0 0,-44 Z"
        fill="url(#cyanAccent)"
      />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>

    <!-- Top Apex Crown Jewels (3 Minimalist Dots) -->
    <circle cx="200" cy="56" r="6" fill="url(#cyanAccent)" />
    <circle cx="166" cy="66" r="4.5" fill="url(#cyanAccent)" opacity="0.8" />
    <circle cx="234" cy="66" r="4.5" fill="url(#cyanAccent)" opacity="0.8" />
  </g>
</svg>
